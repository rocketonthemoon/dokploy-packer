---
- name: Install Dokploy Server
  hosts: localhost
  become: true
  gather_facts: true

  tasks:
    - name: Set up Dokploy
      import_tasks: tasks/dokploy.yaml

    - name: Configure UFW Firewall
      import_tasks: tasks/ufw.yaml

    - name: Harden SSH Security (Disable Password Auth)
      import_tasks: tasks/ssh.yaml