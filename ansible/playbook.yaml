---
- name: Configure Docker and Dokploy Base Image
  hosts: localhost
  become: true
  gather_facts: true

  tasks:
    - name: Set up Docker & Pre-cache Dokploy Images
      import_tasks: tasks/images.yaml

    - name: Configure UFW Firewall
      import_tasks: tasks/ufw.yaml

    - name: Harden SSH Security (Disable Password Auth)
      import_tasks: tasks/ssh.yaml