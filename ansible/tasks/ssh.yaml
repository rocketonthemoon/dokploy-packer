---
- name: Enforce key-only authentication via top-priority drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-disable-password-auth.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: '0644'

- name: Keep cloud-init from re-enabling password auth on reboot
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg
    regexp: '^(\s*)#?\s*ssh_pwauth:'
    line: 'ssh_pwauth: false'
    state: present
  failed_when: false

- name: Reload SSH service
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
